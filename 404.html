<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKER ZOO // 404</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .error-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 45, 45, 0.05), transparent 60%);
        }

        .error-code {
            font-family: var(--font-head);
            font-size: clamp(8rem, 20vw, 16rem);
            font-weight: 900;
            line-height: 0.9;
            color: transparent;
            -webkit-text-stroke: 2px var(--line-strong);
            margin-bottom: 1rem;
        }

        .error-message {
            font-family: var(--font-head);
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .error-detail {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }
    </style>
</head>

<body>
    <div class="noise-overlay" aria-hidden="true"></div>

    <main class="error-page">
        <div style="position: relative; z-index: 2;">
            <div class="error-code">404</div>
            <h1 class="error-message">LOST IN THE <span class="text-accent">ZOO</span></h1>
            <p class="error-detail">This artifact doesn't exist in the archive.</p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn-accent"><span>GO HOME</span></a>
                <a href="showcase.html" class="btn-magnet">BROWSE ARCHIVE</a>
            </div>
        </div>
    </main>
</body>

</html>
