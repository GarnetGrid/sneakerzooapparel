<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKER ZOO // ACCOUNT</title>
    <meta name="description" content="Your Sneaker Zoo account. Log in or create your profile.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <style>
        .account-hero {
            padding: 14rem 0 4rem;
            text-align: center;
        }

        .auth-container {
            max-width: 450px;
            margin: 0 auto 6rem;
            padding: 0 var(--pad);
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--line);
            margin-bottom: 2.5rem;
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            transition: all 0.2s;
        }

        .auth-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }

        .auth-panel {
            display: none;
        }

        .auth-panel.active {
            display: block;
            animation: fadeInUp 0.4s var(--ease-out-expo);
        }

        .auth-field {
            margin-bottom: 1.5rem;
        }

        .auth-field label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .auth-field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line-strong);
            color: var(--text-primary);
            padding: 0.9rem 1rem;
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .auth-field input:focus {
            border-color: var(--accent);
        }

        /* Dashboard */
        .dashboard {
            max-width: 700px;
            margin: 0 auto 6rem;
            padding: 0 var(--pad);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard-stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .dashboard-stat {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 1.5rem;
            text-align: center;
        }

        .dashboard-stat .stat-val {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 2rem;
        }

        .dashboard-stat .stat-lbl {
            font-family: var(--font-cyber);
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }
    </style>
</head>

<body class="loading">
    <div id="loader">
        <div class="loader-brand">SNEAKER ZOO</div>
        <div class="loader-bar"></div>
    </div>
    <div class="noise-overlay" aria-hidden="true"></div>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <main id="main-content">

        <div class="account-hero">
            <p class="chapter-title reveal">YOUR PROFILE</p>
            <h1 class="display-medium reveal">MY<br><span class="text-accent">ACCOUNT</span></h1>
        </div>

        <!-- AUTH FORMS (shown when logged out) -->
        <div id="auth-forms" class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">LOG IN</button>
                <button class="auth-tab" data-tab="register">REGISTER</button>
            </div>

            <!-- LOGIN -->
            <form id="login-form" class="auth-panel active">
                <div class="auth-field">
                    <label for="login-user">USERNAME</label>
                    <input type="text" id="login-user" name="username" required>
                </div>
                <div class="auth-field">
                    <label for="login-pass">PASSWORD</label>
                    <input type="password" id="login-pass" name="password" required>
                </div>
                <button type="submit" class="btn-accent full-width" style="padding: 1.1rem; margin-top: 0.5rem;">
                    <span>ACCESS</span>
                </button>
            </form>

            <!-- REGISTER -->
            <form id="register-form" class="auth-panel">
                <div class="auth-field">
                    <label for="reg-user">CHOOSE USERNAME</label>
                    <input type="text" id="reg-user" name="username" required>
                </div>
                <div class="auth-field">
                    <label for="reg-email">EMAIL ADDRESS</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="auth-field">
                    <label for="reg-pass">CREATE PASSWORD</label>
                    <input type="password" id="reg-pass" name="password" required>
                </div>
                <button type="submit" class="btn-accent full-width" style="padding: 1.1rem; margin-top: 0.5rem;">
                    <span>CREATE ACCOUNT</span>
                </button>
            </form>
        </div>

        <!-- DASHBOARD (shown when logged in) -->
        <div id="account-dashboard" class="dashboard" style="display: none;">
            <div class="dashboard-header">
                <div>
                    <h2 id="dashboard-greeting" style="font-family: var(--font-head); font-size: 1.5rem;">WELCOME BACK
                    </h2>
                    <p
                        style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem;">
                        MEMBER SINCE: <span id="dashboard-joined">—</span>
                    </p>
                </div>
                <button id="logout-btn" class="btn-gallery" style="padding: 0.7rem 1.5rem;">LOG OUT</button>
            </div>

            <div class="dashboard-stat-grid">
                <div class="dashboard-stat">
                    <div class="stat-val" id="dash-orders">0</div>
                    <div class="stat-lbl">ORDERS</div>
                </div>
                <div class="dashboard-stat">
                    <div class="stat-val" id="dash-items">0</div>
                    <div class="stat-lbl">ITEMS IN CART</div>
                </div>
                <div class="dashboard-stat">
                    <div class="stat-val" style="color: var(--accent);">●</div>
                    <div class="stat-lbl">MEMBER STATUS</div>
                </div>
            </div>

            <div style="text-align: center; padding: 3rem 0;">
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Order history and tracking will be available
                    soon.</p>
                <a href="showcase.html" class="btn-accent"><span>CONTINUE SHOPPING</span></a>
            </div>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab === 'login' ? 'login-form' : 'register-form').classList.add('active');
            });
        });

        // Show cart count in dashboard
        document.addEventListener('DOMContentLoaded', () => {
            const cart = JSON.parse(localStorage.getItem('sz_cart') || '[]');
            const el = document.getElementById('dash-items');
            if (el) el.textContent = cart.length;
        });
    </script>
</body>

</html>
